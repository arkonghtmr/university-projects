{% extends 'catalog/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <h1>Вход</h1>
        <p>Авторизуйтесь для работы с товарами и партиями.</p>
    </div>
</section>

<form class="form-panel" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-grid">
        {% for field in form %}
            <label>
                {{ field.label }}
                {{ field }}
                {{ field.errors }}
            </label>
        {% endfor %}
    </div>
    <button class="button" type="submit">Войти</button>
</form>
{% endblock %}
