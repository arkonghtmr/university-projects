{% extends 'catalog/base.html' %}

{% block title %}Удалить {{ product.name }}{% endblock %}

{% block content %}
<a class="back-link" href="{{ product.get_absolute_url }}">Назад к товару</a>

<section class="detail-panel">
    <div>
        <h1>Удалить товар</h1>
        <p>Товар «{{ product.name }}» будет удален из каталога.</p>
    </div>
    <form class="actions" method="post">
        {% csrf_token %}
        <button class="button button--danger" type="submit">Удалить</button>
        <a class="button button--muted" href="{{ product.get_absolute_url }}">Отмена</a>
    </form>
</section>
{% endblock %}
