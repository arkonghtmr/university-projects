<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Информация об аккумуляторе</title>
</head>
<body>
    <a href="{% url 'product_list' %}">Назад к списку аккумуляторов</a>
    <hr>
    {% if product %}
        <h1>{{ product.name }}</h1>
        <p>Характеристики: {{ product.desc }}</p>
        <p>Цена: {{ product.price }} руб.</p>
    {% else %}
        <h1>Аккумулятор не найден</h1>
    {% endif %}
</body>
</html>
