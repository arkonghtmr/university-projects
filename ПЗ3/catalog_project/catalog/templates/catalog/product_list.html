<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог аккумуляторов</title>
</head>
<body>
    <h1>Магазин аккумуляторов</h1>
    <a href="{% url 'about' %}">О магазине</a>
    <hr>
    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'product_detail' product.id %}">{{ product.name }}</a> - {{ product.price }} руб.
            </li>
        {% endfor %}
    </ul>
</body>
</html>
